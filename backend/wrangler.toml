name = "game-hub-api"
main = "src/worker.js"
compatibility_date = "2026-08-11"
workers_dev = true

[vars]
APP_ORIGIN = "https://brilloburundi-ship-it.github.io"
APP_PATH = "/game-hub/"
FOUNDER_GITHUB_LOGINS = "brilloburundi-ship-it"

[[d1_databases]]
binding = "DB"
database_name = "game-hub"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

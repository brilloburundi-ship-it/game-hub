let ships=[],balls=[],fx=[],events=[],roundEnd=performance.now()+300000,lastAI=0,nextId=1,announceTimer=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function post(s){events.unshift(s);events=events.slice(0,4);feedEl.innerHTML=events.map(v=>'<div>'+v+'</div>').join('')}
function say(s){ann.textContent=s;ann.classList.add('show');announceTimer=performance.now()+1800}
function freeSpot(){for(let k=0;k<80;k++){let p={x:rnd(90,W-90),y:rnd(90,H-90)};if(islands.every(i=>Math.hypot(p.x-i.x,p.y-i.y)>i.r+58))return p}return{x:W/2,y:100}}
function shipBy(name){return ships.find(s=>s.name.toLowerCase()===String(name).toLowerCase()&&!s.dead)}
function addShip(name,bot=false){if(ships.length>=40)return null;let old=shipBy(name);if(old)return old;let p=freeSpot(),s={id:nextId++,name:String(name).slice(0,18),x:p.x,y:p.y,a:rnd(0,Math.PI*2),tx:p.x,ty:p.y,hp:100,max:100,dmg:10,spd:38,rate:1.65,range:245,last:0,target:null,kills:0,level:1,color:COLORS[(nextId-2)%COLORS.length],dead:false,sink:0,respawn:0,shield:0,rapid:0,triple:0,bot};ships.push(s);post('⚓ '+s.name+' joined the sea');if(!bot)say('⚓ '+s.name+' launched!');return s}
function upgrade(name,type,val=1){let s=shipBy(name)||addShip(name);if(!s)return;if(type==='like'){s.hp=Math.min(s.max,s.hp+val*.2);if(val>=100)s.rapid=performance.now()+5000;post('❤️ '+s.name+' received '+val+' likes')}if(type==='rose'){s.level=Math.min(20,s.level+1);s.max+=8;s.hp=Math.min(s.max,s.hp+12);s.dmg+=1.5;s.spd+=1.1;s.rate=Math.max(.55,s.rate*.985);post('🌹 '+s.name+' reached Lv.'+s.level);say('🌹 '+s.name+' LEVEL UP')}if(type==='follow'){s.level++;s.max+=25;s.hp=s.max;s.spd*=1.1;s.shield=performance.now()+5000;post('⭐ '+s.name+' FOLLOW upgrade');say('⭐ FOLLOW BOOST • '+s.name)}if(type==='gift1'){s.hp=Math.min(s.max,s.hp+30);s.dmg+=2;post('🎁 '+s.name+' reinforced')}if(type==='gift2'){s.rapid=performance.now()+9000;s.shield=performance.now()+5000;post('🎁 '+s.name+' activated RAPID FIRE')}if(type==='gift3'){s.triple=performance.now()+9000;s.dmg+=4;post('💥 '+s.name+' activated BROADSIDE');say('💥 BROADSIDE • '+s.name)}if(type==='gift4'){s.triple=performance.now()+14000;s.rapid=performance.now()+14000;s.shield=performance.now()+10000;s.max+=40;s.hp=s.max;s.spd*=1.12;s.dmg+=8;post('👑 '+s.name+' LEGENDARY SHIP');say('👑 LEGENDARY SHIP • '+s.name)}}
function pickTarget(s){let best=null,bd=1e9;for(const o of ships)if(o!==s&&!o.dead){let d=dist(s,o);if(d<bd){bd=d;best=o}}s.target=best&&bd<430?best:null;if(!s.target&&Math.hypot(s.tx-s.x,s.ty-s.y)<50){let p=freeSpot();s.tx=p.x;s.ty=p.y}}
function blocked(nx,ny){return nx<38||ny<55||nx>W-38||ny>H-38||islands.some(i=>Math.hypot(nx-i.x,ny-i.y)<i.r+28)}
function fire(s,t,now){let cd=s.rate*(now<s.rapid?.55:1);if((now-s.last)/1000<cd)return;s.last=now;let ang=Math.atan2(t.y-s.y,t.x-s.x),count=now<s.triple?3:1;for(let j=0;j<count;j++){let aa=ang+(j-(count-1)/2)*.13;balls.push({x:s.x+Math.cos(aa)*28,y:s.y+Math.sin(aa)*28,vx:Math.cos(aa)*250,vy:Math.sin(aa)*250,life:1.45,own:s,damage:s.dmg})}fx.push({x:s.x+Math.cos(ang)*32,y:s.y+Math.sin(ang)*32,t:.2,k:'smoke'})}
function hit(b,s,now){if(now<s.shield){fx.push({x:s.x,y:s.y,t:.25,k:'shield'});return}s.hp-=b.damage;fx.push({x:b.x,y:b.y,t:.35,k:'boom'});if(s.hp<=0&&!s.dead){s.dead=true;s.sink=1;s.respawn=now+9000;b.own.kills++;post('💀 '+b.own.name+' sank '+s.name);say('💀 '+s.name+' SUNK')}}
function ai(now){for(const s of ships)if(!s.dead)pickTarget(s)}
function update(dt,now){if(now>roundEnd){let w=[...ships].sort((a,b)=>b.kills-a.kills)[0];if(w)say('🏆 KING OF THE SEA • '+w.name);roundEnd=now+300000;for(const s of ships)s.kills=0}if(now-lastAI>300){lastAI=now;ai(now)}for(const s of ships){if(s.dead){s.sink-=dt*.55;if(now>s.respawn){let p=freeSpot();s.x=p.x;s.y=p.y;s.hp=s.max;s.dead=false;s.sink=0;s.shield=now+2000;post('🌊 '+s.name+' respawned')}continue}let dx,dy;if(s.target&&!s.target.dead){let d=dist(s,s.target),a=Math.atan2(s.target.y-s.y,s.target.x-s.x);if(d<s.range){s.a+=Math.atan2(Math.sin(a-s.a),Math.cos(a-s.a))*dt*2.8;fire(s,s.target,now);dx=Math.cos(a+Math.PI/2);dy=Math.sin(a+Math.PI/2)}else{dx=Math.cos(a);dy=Math.sin(a)}}else{let a=Math.atan2(s.ty-s.y,s.tx-s.x);dx=Math.cos(a);dy=Math.sin(a);s.a+=Math.atan2(Math.sin(a-s.a),Math.cos(a-s.a))*dt*2}let speed=s.spd*(s.hp<s.max*.25?.72:1),nx=s.x+dx*speed*dt,ny=s.y+dy*speed*dt;if(!blocked(nx,ny)){s.x=nx;s.y=ny}else{s.tx=rnd(60,W-60);s.ty=rnd(70,H-60);s.a+=1.7*dt}}
for(let i=balls.length-1;i>=0;i--){let b=balls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=b.life<=0||b.x<0||b.y<0||b.x>W||b.y>H;for(const s of ships)if(!gone&&!s.dead&&s!==b.own&&Math.hypot(b.x-s.x,b.y-s.y)<25){hit(b,s,now);gone=true}if(gone)balls.splice(i,1)}for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1)}}
function sea(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#176e89');g.addColorStop(1,'#0a425d');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.16;x.strokeStyle='#b8efff';x.lineWidth=1;for(let y=45;y<H;y+=58)for(let xx=((y/58)%2)*28;xx<W;xx+=82){x.beginPath();x.arc(xx,y,18,0,Math.PI);x.stroke()}x.globalAlpha=1;for(const i of islands){x.beginPath();x.fillStyle='#dfc277';x.arc(i.x,i.y,i.r+13,0,7);x.fill();x.beginPath();x.fillStyle='#6c9b56';x.arc(i.x,i.y,i.r,0,7);x.fill();for(let k=0;k<5;k++){let a=k*1.25+i.x*.01;x.fillStyle='#315f3d';x.beginPath();x.arc(i.x+Math.cos(a)*i.r*.56,i.y+Math.sin(a)*i.r*.56,9,0,7);x.fill()}}}}
function drawShip(s,now){let alpha=1,scale=1;if(s.dead){alpha=clamp(s.sink,0,1);scale=.55+.45*alpha}x.save();x.translate(s.x,s.y);x.rotate(s.a+Math.PI/2);x.globalAlpha=alpha;x.shadowColor='#001018aa';x.shadowBlur=8;x.shadowOffsetY=6;let w=42*scale,h=72*scale;x.drawImage(img,-w/2,-h/2,w,h);x.shadowColor='transparent';x.globalCompositeOperation='source-atop';x.globalAlpha=.45*alpha;x.fillStyle=s.color;x.fillRect(-w/2,-h/2,w,h);x.globalCompositeOperation='source-over';x.globalAlpha=alpha;if(now<s.shield){x.strokeStyle='#8eeaff';x.lineWidth=3;x.beginPath();x.arc(0,0,34,0,7);x.stroke()}x.restore();if(!s.dead){let hp=clamp(s.hp/s.max,0,1);x.font='700 12px system-ui';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#00202b';x.lineWidth=3;x.strokeText(s.name+' Lv.'+s.level,s.x,s.y-48);x.fillText(s.name+' Lv.'+s.level,s.x,s.y-48);x.fillStyle='#09202a';x.fillRect(s.x-28,s.y-42,56,5);x.fillStyle=hp>.5?'#53e878':hp>.25?'#ffbf4b':'#ff4f54';x.fillRect(s.x-28,s.y-42,56*hp,5);if(hp<.55){let n=hp<.25?3:1;for(let k=0;k<n;k++){x.globalAlpha=.45;x.fillStyle=hp<.25?'#241d1b':'#52666b';x.beginPath();x.arc(s.x+rnd(-8,8),s.y-20-rnd(0,22),rnd(4,8),0,7);x.fill();x.globalAlpha=1}if(hp<.25){x.fillStyle='#ff8b31';x.beginPath();x.arc(s.x,s.y-12,5+rnd(0,3),0,7);x.fill()}}}}
function draw(now){sea();for(const b of balls){x.fillStyle='#20252a';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill();x.strokeStyle='#fff7';x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);x.stroke()}for(const s of ships)drawShip(s,now);for(const f of fx){x.globalAlpha=clamp(f.t*3,0,1);if(f.k==='boom'){x.fillStyle='#ffb33b';x.beginPath();x.arc(f.x,f.y,18*(1-f.t),0,7);x.fill()}else{x.strokeStyle='#b9f4ff';x.lineWidth=3;x.beginPath();x.arc(f.x,f.y,30,0,7);x.stroke()}x.globalAlpha=1}}
function ui(now){let sec=Math.max(0,Math.ceil((roundEnd-now)/1000));timerEl.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');rankEl.innerHTML=[...ships].sort((a,b)=>b.kills-a.kills||b.level-a.level).slice(0,5).map((s,i)=>'<div>'+(i+1)+'. '+s.name+' — '+s.kills+' K</div>').join('');if(now>announceTimer)ann.classList.remove('show')}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt,now);draw(now);ui(now);requestAnimationFrame(loop)}
function reset(){ships=[];balls=[];fx=[];events=[];nextId=1;roundEnd=performance.now()+300000;post('🌊 New sea ready')}
document.querySelector('.controls').addEventListener('click',e=>{let a=e.target.dataset.act;if(!a)return;let n=document.querySelector('#name').value.trim()||'Captain';if(a==='join')addShip(n);else if(a==='bots')for(let i=0;i<10;i++)addShip(names[(ships.length+i)%names.length]+Math.floor(rnd(1,99)),true);else if(a==='reset')reset();else upgrade(n,a==='like'?'like':a,a==='like'?10:1)});
window.PirateLive={join:n=>addShip(n),like:(n,c=1)=>upgrade(n,'like',c),follow:n=>upgrade(n,'follow'),rose:n=>upgrade(n,'rose'),gift:(n,t=1)=>upgrade(n,'gift'+clamp(Number(t)||1,1,4))};
window.addEventListener('message',e=>{let d=e.data||{};if(d.type==='join')PirateLive.join(d.username);if(d.type==='like')PirateLive.like(d.username,d.count||1);if(d.type==='follow')PirateLive.follow(d.username);if(d.type==='rose')PirateLive.rose(d.username);if(d.type==='gift')PirateLive.gift(d.username,d.tier||1)});
img.onload=()=>{for(let i=0;i<14;i++)addShip(names[i],true);post('🧪 Test fleet loaded');requestAnimationFrame(loop)};img.onerror=()=>{document.querySelector('#status').textContent='Ship asset failed to load'};
})();

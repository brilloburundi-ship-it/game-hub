<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082736">
<meta name="game-build" content="PIRATE_SHIP_BATTLE_V1">
<title>Pirate Ship Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#061820;color:#eefcff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.shell{width:min(100%,1600px);margin:auto;padding:10px}.frame{position:relative;aspect-ratio:16/9;background:#0b5068;border:1px solid #2b7185;overflow:hidden;box-shadow:0 12px 40px #0008}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 3px #001}.title{position:absolute;left:18px;top:14px;font-weight:900;font-size:clamp(15px,1.55vw,25px);letter-spacing:.08em}.hint{position:absolute;left:18px;top:47px;padding:7px 10px;background:#001a24aa;border:1px solid #ffffff26;border-radius:8px;font-size:clamp(10px,.9vw,14px)}.round{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:9px;background:#001a24bd;border:1px solid #ffffff26;font-weight:800}.rank{position:absolute;right:14px;top:14px;width:min(260px,24%);padding:10px 12px;border-radius:10px;background:#001a24c9;border:1px solid #ffffff26;font-size:clamp(10px,.85vw,14px)}.rank b{display:block;color:#ffe294;margin-bottom:5px}.rank div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.feed{position:absolute;left:14px;bottom:14px;width:min(430px,42%);padding:9px 11px;border-radius:10px;background:#001a24c9;border:1px solid #ffffff26;font-size:clamp(9px,.78vw,13px)}.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.announce{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#07151ee6;border:1px solid #ffe49a88;font-weight:900;font-size:clamp(13px,1.4vw,22px);opacity:0;transition:.2s}.announce.show{opacity:1}.controls{margin-top:10px;padding:10px;background:#0b202a;border:1px solid #24424c;border-radius:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;font-size:12px;color:#abc7d0}input,button{min-height:40px;border-radius:8px;border:1px solid #365660;background:#102d37;color:white;padding:0 11px;font:inherit}input{width:150px}button{cursor:pointer;font-weight:800}button:hover{background:#17404d}.primary{background:#136b7e}.danger{background:#78323c}.status{margin-left:auto;font-size:12px;color:#8ddbe9}@media(max-width:700px){.shell{padding:0}.frame{border:0}.controls{border-radius:0;margin:0}.rank{width:31%}.hint{top:42px}.feed{width:48%}}
</style>
</head>
<body>
<main class="shell">
<section class="frame">
<canvas id="game" width="1280" height="720"></canvas>
<div class="hud">
<div class="title">PIRATE SHIP BATTLE</div>
<div class="hint">Type <b>JOIN</b> in chat to create your ship</div>
<div class="round" id="timer">05:00</div>
<div class="rank"><b>TOP CAPTAINS</b><section id="rank"></section></div>
<div class="feed" id="feed"></div>
<div class="announce" id="announce"></div>
</div>
</section>
<section class="controls" aria-label="Test controls">
<label>Test viewer<input id="name" value="CaptainJack" maxlength="18"></label>
<button class="primary" data-act="join">JOIN</button>
<button data-act="like">LIKE +10</button>
<button data-act="rose">ROSE</button>
<button data-act="follow">FOLLOW</button>
<button data-act="gift1">GIFT I</button>
<button data-act="gift2">GIFT II</button>
<button data-act="gift3">GIFT III</button>
<button data-act="gift4">GIFT IV</button>
<button data-act="bots">+10 BOTS</button>
<button class="danger" data-act="reset">RESET</button>
<span class="status" id="status">TEST MODE • TikFinity-ready bridge</span>
</section>
</main>
<script>
(() => {
'use strict';
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const rankEl = document.querySelector('#rank');
const feedEl = document.querySelector('#feed');
const timerEl = document.querySelector('#timer');
const announceEl = document.querySelector('#announce');
const shipImage = new Image();
shipImage.src = 'ship.png';
const COLORS = ['#ff4e5d','#47c9ff','#ffd34d','#62e087','#b979ff','#ff8a3d','#43ead4','#ff78ca','#ececec','#6c8cff','#c5ff4b','#ffb84c'];
const BOT_NAMES = ['RedBeard','SeaWolf','BlackPearl','StormJack','BlueFin','RumRunner','NightSail','GoldHook','WaveKing','SkullKid','CannonJoe','SharkBite','IronMast','SeaFox','LuckyAnne','KrakenFan','SaltKing','Corsair','MadRoger','BlueRose'];
const islands = [{x:130,y:160,r:78},{x:1130,y:135,r:100},{x:205,y:585,r:95},{x:1060,y:570,r:125},{x:640,y:360,r:62}];
let ships = [], balls = [], effects = [], feed = [];
let roundEnd = performance.now() + 300000;
let lastAI = 0, nextId = 1, announceUntil = 0;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rnd = (a,b) => a + Math.random() * (b-a);
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
function post(text){ feed.unshift(text); feed = feed.slice(0,4); feedEl.innerHTML = feed.map(v=>`<div>${v}</div>`).join(''); }
function announce(text){ announceEl.textContent = text; announceEl.classList.add('show'); announceUntil = performance.now()+1800; }
function randomOpenSpot(){
  for(let i=0;i<90;i++){
    const p={x:rnd(85,W-85),y:rnd(85,H-85)};
    if(islands.every(o=>Math.hypot(p.x-o.x,p.y-o.y)>o.r+60)) return p;
  }
  return {x:W/2,y:90};
}
function getShip(name){ return ships.find(s=>s.name.toLowerCase()===String(name).toLowerCase() && !s.dead); }
function addShip(name,bot=false){
  if(ships.length>=40) return null;
  const existing=getShip(name); if(existing) return existing;
  const p=randomOpenSpot();
  const s={id:nextId++,name:String(name).trim().slice(0,18)||'Captain',x:p.x,y:p.y,a:rnd(0,Math.PI*2),tx:p.x,ty:p.y,hp:100,maxHp:100,damage:10,speed:42,fireRate:1.65,range:245,lastShot:0,target:null,kills:0,level:1,color:COLORS[(nextId-2)%COLORS.length],dead:false,sink:0,respawnAt:0,shieldUntil:0,rapidUntil:0,tripleUntil:0,bot};
  ships.push(s); post(`⚓ ${s.name} joined the sea`); if(!bot) announce(`⚓ ${s.name} launched!`); return s;
}
function upgrade(name,type,value=1){
  const s=getShip(name)||addShip(name); if(!s) return;
  const now=performance.now();
  if(type==='like'){
    s.hp=Math.min(s.maxHp,s.hp+value*0.2);
    if(value>=100) s.rapidUntil=now+5000;
    post(`❤️ ${s.name} received ${value} likes`);
  } else if(type==='rose'){
    s.level=Math.min(20,s.level+1); s.maxHp+=8; s.hp=Math.min(s.maxHp,s.hp+14); s.damage+=1.5; s.speed+=1.2; s.fireRate=Math.max(.6,s.fireRate*.985);
    post(`🌹 ${s.name} reached Lv.${s.level}`); announce(`🌹 ${s.name} LEVEL UP`);
  } else if(type==='follow'){
    s.level++; s.maxHp+=25; s.hp=s.maxHp; s.speed*=1.10; s.shieldUntil=now+5000;
    post(`⭐ ${s.name} FOLLOW upgrade`); announce(`⭐ FOLLOW BOOST • ${s.name}`);
  } else if(type==='gift1'){
    s.hp=Math.min(s.maxHp,s.hp+30); s.damage+=2; post(`🎁 ${s.name} reinforced`);
  } else if(type==='gift2'){
    s.rapidUntil=now+9000; s.shieldUntil=now+5000; post(`🎁 ${s.name} activated RAPID FIRE`);
  } else if(type==='gift3'){
    s.tripleUntil=now+9000; s.damage+=4; post(`💥 ${s.name} activated BROADSIDE`); announce(`💥 BROADSIDE • ${s.name}`);
  } else if(type==='gift4'){
    s.tripleUntil=now+14000; s.rapidUntil=now+14000; s.shieldUntil=now+10000; s.maxHp+=40; s.hp=s.maxHp; s.speed*=1.12; s.damage+=8;
    post(`👑 ${s.name} LEGENDARY SHIP`); announce(`👑 LEGENDARY SHIP • ${s.name}`);
  }
}
function chooseTarget(s){
  let best=null, bestD=Infinity;
  for(const o of ships){ if(o===s||o.dead) continue; const d=distance(s,o); if(d<bestD){bestD=d;best=o;} }
  s.target=(best&&bestD<440)?best:null;
  if(!s.target && Math.hypot(s.tx-s.x,s.ty-s.y)<55){ const p=randomOpenSpot(); s.tx=p.x; s.ty=p.y; }
}
function blocked(nx,ny){ return nx<38||ny<58||nx>W-38||ny>H-38||islands.some(i=>Math.hypot(nx-i.x,ny-i.y)<i.r+30); }
function fireCannon(s,target,now){
  const multiplier = now<s.rapidUntil ? .55 : 1;
  if((now-s.lastShot)/1000 < s.fireRate*multiplier) return;
  s.lastShot=now;
  const base=Math.atan2(target.y-s.y,target.x-s.x);
  const count=now<s.tripleUntil?3:1;
  for(let j=0;j<count;j++){
    const angle=base+(j-(count-1)/2)*.13;
    balls.push({x:s.x+Math.cos(angle)*30,y:s.y+Math.sin(angle)*30,vx:Math.cos(angle)*255,vy:Math.sin(angle)*255,life:1.55,owner:s,damage:s.damage});
  }
  if(balls.length>120) balls.splice(0,balls.length-120);
  effects.push({x:s.x+Math.cos(base)*31,y:s.y+Math.sin(base)*31,t:.25,kind:'smoke'});
}
function hit(ball,s,now){
  if(now<s.shieldUntil){ effects.push({x:s.x,y:s.y,t:.28,kind:'shield'}); return; }
  s.hp-=ball.damage; effects.push({x:ball.x,y:ball.y,t:.42,kind:'boom'});
  if(s.hp<=0&&!s.dead){ s.hp=0; s.dead=true; s.sink=1; s.respawnAt=now+9000; ball.owner.kills++; post(`💀 ${ball.owner.name} sank ${s.name}`); announce(`💀 ${s.name} SUNK`); }
}
function update(dt,now){
  if(now>roundEnd){ const winner=[...ships].sort((a,b)=>b.kills-a.kills)[0]; if(winner) announce(`🏆 KING OF THE SEA • ${winner.name}`); roundEnd=now+300000; ships.forEach(s=>s.kills=0); }
  if(now-lastAI>300){ lastAI=now; for(const s of ships) if(!s.dead) chooseTarget(s); }
  for(const s of ships){
    if(s.dead){ s.sink-=dt*.55; if(now>s.respawnAt){ const p=randomOpenSpot(); s.x=p.x;s.y=p.y;s.hp=s.maxHp;s.dead=false;s.sink=0;s.shieldUntil=now+2000; post(`🌊 ${s.name} respawned`); } continue; }
    let dx=0,dy=0;
    if(s.target&&!s.target.dead){
      const d=distance(s,s.target), angle=Math.atan2(s.target.y-s.y,s.target.x-s.x);
      if(d<s.range){ s.a+=Math.atan2(Math.sin(angle-s.a),Math.cos(angle-s.a))*dt*2.8; fireCannon(s,s.target,now); dx=Math.cos(angle+Math.PI/2);dy=Math.sin(angle+Math.PI/2); }
      else { dx=Math.cos(angle);dy=Math.sin(angle); s.a+=Math.atan2(Math.sin(angle-s.a),Math.cos(angle-s.a))*dt*2.2; }
    } else {
      const angle=Math.atan2(s.ty-s.y,s.tx-s.x); dx=Math.cos(angle);dy=Math.sin(angle); s.a+=Math.atan2(Math.sin(angle-s.a),Math.cos(angle-s.a))*dt*2;
    }
    const speed=s.speed*(s.hp<s.maxHp*.25?.72:1); const nx=s.x+dx*speed*dt, ny=s.y+dy*speed*dt;
    if(!blocked(nx,ny)){s.x=nx;s.y=ny;} else {const p=randomOpenSpot();s.tx=p.x;s.ty=p.y;s.a+=1.5*dt;}
  }
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i]; b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let gone=b.life<=0||b.x<0||b.y<0||b.x>W||b.y>H;
    if(!gone){ for(const s of ships){ if(!s.dead&&s!==b.owner&&Math.hypot(b.x-s.x,b.y-s.y)<26){hit(b,s,now);gone=true;break;} } }
    if(gone) balls.splice(i,1);
  }
  for(let i=effects.length-1;i>=0;i--){ effects[i].t-=dt; if(effects[i].t<=0) effects.splice(i,1); }
}
function drawSea(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#176e89');g.addColorStop(1,'#0a425d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.16;ctx.strokeStyle='#b8efff';ctx.lineWidth=1;
  for(let y=45;y<H;y+=58) for(let xx=((y/58)%2)*28;xx<W;xx+=82){ctx.beginPath();ctx.arc(xx,y,18,0,Math.PI);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const i of islands){
    ctx.fillStyle='#dfc277';ctx.beginPath();ctx.arc(i.x,i.y,i.r+13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6c9b56';ctx.beginPath();ctx.arc(i.x,i.y,i.r,0,Math.PI*2);ctx.fill();
    for(let k=0;k<5;k++){const a=k*1.25+i.x*.01;ctx.fillStyle='#315f3d';ctx.beginPath();ctx.arc(i.x+Math.cos(a)*i.r*.56,i.y+Math.sin(a)*i.r*.56,9,0,Math.PI*2);ctx.fill();}
  }
}
function drawShip(s,now){
  let alpha=1,scale=1;if(s.dead){alpha=clamp(s.sink,0,1);scale=.55+.45*alpha;}
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a+Math.PI/2);ctx.globalAlpha=alpha;ctx.shadowColor='#001018aa';ctx.shadowBlur=8;ctx.shadowOffsetY=6;
  const w=42*scale,h=72*scale;ctx.drawImage(shipImage,-w/2,-h/2,w,h);ctx.shadowColor='transparent';ctx.globalCompositeOperation='source-atop';ctx.globalAlpha=.42*alpha;ctx.fillStyle=s.color;ctx.fillRect(-w/2,-h/2,w,h);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=alpha;
  if(now<s.shieldUntil){ctx.strokeStyle='#8eeaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
  if(s.dead) return;
  const hp=clamp(s.hp/s.maxHp,0,1);ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#00202b';ctx.lineWidth=3;ctx.strokeText(`${s.name} Lv.${s.level}`,s.x,s.y-48);ctx.fillText(`${s.name} Lv.${s.level}`,s.x,s.y-48);
  ctx.fillStyle='#09202a';ctx.fillRect(s.x-28,s.y-42,56,5);ctx.fillStyle=hp>.5?'#53e878':hp>.25?'#ffbf4b':'#ff4f54';ctx.fillRect(s.x-28,s.y-42,56*hp,5);
  if(hp<.55){ctx.globalAlpha=.42;ctx.fillStyle=hp<.25?'#263238':'#60747a';const count=hp<.25?3:1;for(let k=0;k<count;k++){ctx.beginPath();ctx.arc(s.x+(k-1)*6,s.y-22-k*8,6+k*2,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(hp<.25){ctx.fillStyle='#ff8b31';ctx.beginPath();ctx.arc(s.x,s.y-12,6,0,Math.PI*2);ctx.fill();}}
}
function draw(now){
  drawSea();
  for(const b of balls){ctx.fillStyle='#20252a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff77';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke();}
  for(const s of ships) drawShip(s,now);
  for(const f of effects){ctx.globalAlpha=clamp(f.t*3,0,1);if(f.kind==='boom'){ctx.fillStyle='#ffb33b';ctx.beginPath();ctx.arc(f.x,f.y,10+30*(.45-f.t),0,Math.PI*2);ctx.fill();}else{ctx.strokeStyle='#b9f4ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,30,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;}
}
function updateHUD(now){
  const sec=Math.max(0,Math.ceil((roundEnd-now)/1000));timerEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  rankEl.innerHTML=[...ships].sort((a,b)=>b.kills-a.kills||b.level-a.level).slice(0,5).map((s,i)=>`<div>${i+1}. ${s.name} — ${s.kills} K</div>`).join('');
  if(now>announceUntil) announceEl.classList.remove('show');
}
function resetGame(){ships=[];balls=[];effects=[];feed=[];nextId=1;roundEnd=performance.now()+300000;post('🌊 New sea ready');}
let previous=performance.now();
function frame(now){const dt=Math.min(.033,(now-previous)/1000);previous=now;update(dt,now);draw(now);updateHUD(now);requestAnimationFrame(frame);}
document.querySelector('.controls').addEventListener('click',e=>{
  const action=e.target.dataset.act;if(!action)return;const name=document.querySelector('#name').value.trim()||'Captain';
  if(action==='join') addShip(name);
  else if(action==='bots') for(let i=0;i<10;i++) addShip(`${BOT_NAMES[(ships.length+i)%BOT_NAMES.length]}${Math.floor(rnd(1,99))}`,true);
  else if(action==='reset') resetGame();
  else if(action==='like') upgrade(name,'like',10);
  else upgrade(name,action,1);
});
window.PirateLive={
  join:name=>addShip(name),
  like:(name,count=1)=>upgrade(name,'like',count),
  follow:name=>upgrade(name,'follow'),
  rose:name=>upgrade(name,'rose'),
  gift:(name,tier=1)=>upgrade(name,`gift${clamp(Number(tier)||1,1,4)}`)
};
window.addEventListener('message',e=>{
  const d=e.data||{};if(!d.username)return;
  if(d.type==='join') window.PirateLive.join(d.username);
  else if(d.type==='like') window.PirateLive.like(d.username,d.count||1);
  else if(d.type==='follow') window.PirateLive.follow(d.username);
  else if(d.type==='rose') window.PirateLive.rose(d.username);
  else if(d.type==='gift') window.PirateLive.gift(d.username,d.tier||1);
});
shipImage.onload=()=>{for(let i=0;i<14;i++)addShip(BOT_NAMES[i],true);post('🧪 Test fleet loaded');requestAnimationFrame(frame);};
shipImage.onerror=()=>{document.querySelector('#status').textContent='Ship asset failed to load';};
})();
</script>
</body>
</html>

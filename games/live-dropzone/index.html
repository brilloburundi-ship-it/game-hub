<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090b10">
  <title>LIVE DROPZONE</title>
  <link rel="stylesheet" href="./style.css?v=0.1.0">
</head>
<body>
  <main id="app" class="app" aria-label="LIVE DROPZONE">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">LD</div>
        <div>
          <h1>LIVE DROPZONE</h1>
          <p id="bridgeState">LIVE bridge · pronto</p>
        </div>
      </div>
      <div class="top-stats">
        <div class="stat"><span>VIVI</span><strong id="aliveCount">0</strong></div>
        <div class="stat danger"><span>ZONA</span><strong id="zoneTimer">--:--</strong></div>
      </div>
    </header>

    <section id="arenaShell" class="arena-shell">
      <canvas id="gameCanvas" width="540" height="800" aria-label="Arena battle royale"></canvas>
      <div class="mode-badge" id="modeBadge">LIVE</div>

      <aside class="leaderboard panel" aria-label="Top 3">
        <div class="panel-title">TOP 3</div>
        <ol id="leaderboardList"></ol>
      </aside>

      <aside class="killfeed panel" aria-label="Kill feed">
        <div class="panel-title">ELIMINAZIONI</div>
        <div id="killFeed"></div>
      </aside>

      <div class="queue-chip">
        <span>IN CODA</span>
        <strong id="queueCount">0</strong>
      </div>

      <div class="round-banner" id="roundBanner" hidden>
        <span id="roundBannerKicker">WINNER</span>
        <strong id="roundBannerName">—</strong>
      </div>

      <div class="waiting" id="waitingOverlay">
        <div class="waiting-ring"></div>
        <h2>SCRIVI <b>JOIN</b></h2>
        <p>per entrare nella Dropzone</p>
      </div>
    </section>

    <nav class="interaction-strip" aria-label="Interazioni TikTok LIVE">
      <div><b class="join">★ JOIN</b><span>entra</span></div>
      <div><b class="like">♥ LIKE</b><span>cura</span></div>
      <div><b class="follow">↑ FOLLOW</b><span>upgrade</span></div>
      <div><b class="rose">✿ ROSE</b><span>level up</span></div>
      <div><b class="gift">◆ GIFT</b><span>power</span></div>
    </nav>

    <section id="demoPanel" class="demo-panel" hidden>
      <span>TEST</span>
      <button type="button" data-demo="join">JOIN</button>
      <button type="button" data-demo="like">LIKE</button>
      <button type="button" data-demo="follow">FOLLOW</button>
      <button type="button" data-demo="rose">ROSE</button>
      <button type="button" data-demo="gift">GIFT</button>
    </section>
  </main>

  <script src="./assets-lite.js?v=0.1.0"></script>
  <script src="./bridge.js?v=0.1.0"></script>
  <script src="./game-v01.js?v=0.1.0"></script>
</body>
</html>

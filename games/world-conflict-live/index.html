<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100f"><title>World Conflict Live</title><style>html,body{margin:0;background:#07100f;color:#dff;font-family:system-ui;height:100%}.loading{display:grid;place-items:center;height:100%;text-align:center;padding:24px;box-sizing:border-box}.loading b{font-size:20px}.loading small{opacity:.65}</style></head><body><div class="loading"><div><b>WORLD CONFLICT LIVE</b><br><small>Loading Game Hub build…</small></div></div><script>
(async()=>{try{const names=[1,2,3,4,5,6,7,8].map(n=>`payload.${n}.txt`);const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('This Safari version does not support DecompressionStream. Update iOS/macOS.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>Could not load game</b><br><small>'+String(e.message||e)+'</small></div></div>'}})();
</script></body></html>

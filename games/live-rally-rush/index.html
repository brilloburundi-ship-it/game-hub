*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}canvas{position:fixed;inset:0;width:100%;height:100%}.panel{background:#07111ddd;border:1px solid #4ac8ff44;border-radius:14px;box-shadow:0 12px 30px #0008;backdrop-filter:blur(8px)}#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:7vh 6vw;background:linear-gradient(90deg,#02050bf5,#02050b99 55%,#02050b22)}h1{font-size:min(12vw,92px);line-height:.86;margin:8px 0;font-style:italic}h1 b{color:#ffc928}#menu p{max-width:620px;color:#c3d4e3}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,#back{padding:13px 18px;border:0;border-radius:12px;color:#fff;font-weight:900;background:#0b69a7}.actions button:nth-child(2){background:#9a6109}.actions button:nth-child(3){background:#7135b5}#hud{position:fixed;inset:0;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(165px,235px) 1fr minmax(118px,150px);grid-template-rows:auto 1fr auto;gap:8px}.card{padding:10px}.small{font-size:10px;color:#73d8ff;font-weight:900;letter-spacing:.12em}.stats{display:flex;gap:12px;margin-top:5px;font-weight:900}.stats span{color:#9fb2c4;font-size:10px}.stats b{display:block;color:#fff;font-size:15px}.leaders{grid-column:3;grid-row:1/3;padding:7px 6px}.feed{grid-column:1;grid-row:2;align-self:start}.row{display:grid;grid-template-columns:14px 7px minmax(0,1fr) 30px;gap:4px;padding:4px 0;border-bottom:1px solid #ffffff10;font-size:9px}.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;align-self:center}.focus{grid-column:1/4;grid-row:3;justify-self:center;min-width:min(440px,90vw);display:flex;gap:8px;align-items:center}.bar{height:8px;flex:1;background:#102030;border-radius:9px;overflow:hidden}.ba </style></head><body><canvas id="c"></canvas><div id="menu"><div class="live">● LIVE AUTOMATED RALLY</div><h1>LIVE RALLY <b>RUSH</b></h1><p>Viewers become drivers automatically. Likes charge nitro, gifts trigger boosts and VFX, and every car uses its own customizable team color.</p><div class="actions"><button id="single">🏁 SINGLE RACE</button><button id="tour">🏆 TOURNAMENT</button><button id="test">⚡ TEST LIVE</button></div></div><div id="hud" class="hide"><section class="panel card"><div class="small">LIVE RALLY RUSH</div><div id="raceName"></div><div class="stats"><div><span>LAP</span><b id="lap">1/3</b></div><div><span>POS</span><b id="pos">1/12</b></div><div><span>TIME</span><b id="time">00:00</b></div></div></section><section class="panel card leaders"><div class="small">LIVE STANDINGS</div><div id="leaders"></div></section><section class="panel card feed"><div class="small">LIVE EVENTS</div><div id="feed"></div></section><section class="panel card focus"><b id="focus">GRID OPEN</b><div class="bar"><i id="nitro"></i></div></section></div><div id="banner" class="panel hide"></div><div id="count" class="hide"></div><div id="results" class="hide"><div class="panel"><h2 id="rt">RESULTS</h2><div id="resultRows"></div><p id="next"></p><button id="back">MENU</button></div></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),TAU=Math.PI*2,colors=['#ff304f','#18a8ff','#37e35f','#ffd228','#ff8b1f','#b94cff','#00e2d0','#ff5ec7','#e9f2ff','#566270','#9cff2e','#ff7043'],names={RED:'#ff304f',BLUE:'#18a8ff',GREEN:'#37e35f',YELLOW:'#ffd228',ORANGE:'#ff8b1f',PURPLE:'#b94cff',CYAN:'#00e2d0',PINK:'#ff5ec7',WHITE:'#e9f2ff',BLACK:'#313945'};const atlas=new Image(),PW=42,PH=44,prefabs=new Map;fetch('assets/cars/prefabs.webp',{cache:'force-cache'}).then(r=>r.text()).then(s=>{atlas.src='data:image/webp;base64,'+s.trim()}).catch(()=>{});atlas.onload=()=>prefabs.clear();function prefab(m,c){if(!atlas.complete||!atlas.naturalWidth)return null;m=((m%6)+6)%6;let k=m+'|'+c;if(prefabs.has(k))return prefabs.get(k);let out=document.createElement('canvas');out.width=PW;out.height=PH;let o=out.getContext('2d'),body=document.createElement('canvas');body.width=PW;body.height=PH;let b=body.getContext('2d');b.drawImage(atlas,0,m*PH,PW,PH,0,0,PW,PH);b.globalCompositeOperation='source-atop';b.globalAlpha=.76;b.fillStyle=c;b.fillRect(0,0,PW,PH);b.globalCompositeOperation='source-over';b.globalAlpha=1;o.drawImage(body,0,0);o.drawImage(atlas,PW,m*PH,PW,PH,0,0,PW,PH);prefabs.set(k,out);return out;}let W,H,dpr=1;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const tracks=[['Monte Carlo Coast','#183d38',0],['Desert Rally','#7d5b32',1],['Glacier Run','#d5e4eb',2],['Forest Storm','#183823',3],['Neon Night','#071327',4]];function tp(u,k){let a=u*TAU,r=1+.17*Math.sin(a*(k+2)+k),rx=W*.34,ry=H*.31;return{x:W*.5+Math.cos(a)*rx*r+Math.sin(a*3+k)*W*.035,y:H*.5+Math.sin(a)*ry*r+Math.cos(a*2-k)*H*.035}}function tpa(u,k){let p=tp(u,k),q=tp(u+.001,k),a=Math.atan2(q.y-p.y,q.x-p.x);return{x:p.x,y:p.y,a,nx:-Math.sin(a),ny:Math.cos(a)}}class P{constructor(n,i){this.name=n;this.color=colors[i%colors.length];this.model=i%6;this.points=0;this.d=null}}class D{constructor(p,i){this.p=p;this.u=-i*.012;this.speed=.053+Math.random()*.008;this.lane=(i%3-1)*17;this.nitro=20;this.boost=0;this.done=0;this.rank=i+1}tick(dt,g){if(this.done)return;let bend=Math.abs(Math.sin(this.u*TAU*(2+g.track)));let v=this.speed*(1-bend*.08);if(this.boost>0){v+=.035;this.boost-=dt}this.nitro=Math.min(100,this.nitro+dt*2);if(this.nitro>70&&Math.random()<.002){this.nitro-=35;this.boost=.7;g.spark(this,'#32d8ff',12)}this.u+=v*dt;if(this.u>=g.laps){this.done=g.t;g.log(this.p.name+' finished','🏁')}}pos(g){let q=tpa(((this.u%1)+1)%1,g.track);return{x:q.x+q.nx*this.lane,y:q.y+q.ny*this.lane,a:q.a}}}class G{constructor(){this.ps=new Map;this.q=[];this.ds=[];this.fx=[];this.feed=[];this.state='menu';this.mode='single';this.stage=0;this.track=0;this.laps=3;this.t=0;this.until=0;this.roster=[];this.focus=null;this.last=performance.now();this.bind();this.ws();requestAnimationFrame(t=>this.loop(t))}bind(){$('single').onclick=()=>this.open('single');$('tour').onclick=()=>this.open('tour');$('test').onclick=()=>{for(let i=1;i<=10;i++)this.join('@rally_'+i);this.open('single');this.testTimer=setInterval(()=>{let p=[...this.ps.values()][Math.floor(Math.random()*this.ps.size)];if(p)this.event({type:Math.random()<.7?'like':'gift',username:p.name,count:20,value:Math.random()*800})},1800)};$('back').onclick=()=>this.menu();window.LiveRallyRushEvent=e=>this.event(e);addEventListener('tiktok-live',e=>this.event(e.detail||{}))}ws(){let url=new URLSearchParams(location.search).get('ws')||localStorage.lrr_ws;if(!url)return;try{let w=new WebSocket(url);w.onmessage=e=>{try{this.event(JSON.parse(e.data))}catch{}};w.onopen=()=>this.log('LIVE bridge connected','🟢');w.onclose=()=>setTimeout(()=>this.ws(),2500)}catch{}}join(n){n=String(n||'viewer').replace(/^@/,'');if(this.ps.has(n))return this.ps.get(n);let p=new P('@'+n,this.ps.size);this.ps.set(n,p);if(this.state==='grid'&&this.ds.length<12){this.ds.push(new D(p,this.ds.length));p.d=this.ds.at(-1);this.log(p.name+' entered the grid','🏎️')}else this.q.push(p);return p}event(e){let type=String(e.type||e.event||'').toLowerCase(),p=this.join(e.username||e.user||e.nickname||'viewer');if(type.includes('comment')){let s=String(e.comment||e.text||'').toUpperCase(),m=s.match(/COLOR\s+(RED|BLUE|GREEN|YELLOW|ORANGE|PURPLE|CYAN|PINK|WHITE|BLACK)/);if(m){p.color=names[m[1]];this.log(p.name+' changed color','🎨')}let c=s.match(/CAR\s+([1-6])/);if(c)p.model=+c[1]-1;return}if(type.includes('like')){p.d&&(p.d.nitro=Math.min(100,p.d.nitro+(+e.count||1)*1.4));return}if(type.includes('follow')){p.d&&(p.d.boost=Math.max(p.d.boost,1.4));this.log(p.name+' FOLLOW BOOST','💙');return}if(type.includes('share')){p.d&&(p.d.boost=Math.max(p.d.boost,1));return}if(type.includes('gift')){let v=+e.value||+e.diamonds||+e.count||1;if(p.d){p.d.boost=Math.max(p.d.boost,v>500?3:v>100?1.8:.8);p.d.nitro=100;this.focus=p;this.spark(p.d,v>500?'#ff45c8':'#ffb52e',v>500?45:20);this.banner(p.name+(v>500?' RALLY STORM!':' GIFT TURBO!'))}}}open(mode){this.mode=mode;this.stage=0;this.track=Math.floor(Math.random()*tracks.length);if(!this.ps.size)for(let i=1;i<=8;i++)this.join('@driver_'+i);if(mode==='tour')this.roster=[...this.ps.values()].slice(0,12);this.grid()}grid(){this.state='grid';this.t=0;this.until=5;$('menu').classList.add('hide');$('hud').classList.remove('hide');$('results').classList.add('hide');let pool=this.mode==='tour'?this.roster:[...this.ps.values()].slice(0,12);this.ds=pool.map((p,i)=>{let d=new D(p,i);p.d=d;return d});this.focus=pool[0];this.banner('GRID OPEN · viewers join automatically');this.hud()}countdown(){this.state='count';this.until=3.2;$('count').classList.remove('hide')}race(){this.state='race';this.t=0;$('count').classList.add('hide');this.banner('GO!')}finish(){this.state='result';let a=[...this.ds].sort((x,y)=>x.done-y.done),pts=[25,18,15,12,10,8,6,4,2,1];a.forEach((d,i)=>this.mode==='tour'&&(d.p.points+=pts[i]||0));$('rt').textContent=this.mode==='tour'?'STAGE '+(this.stage+1)+' RESULTS':'RACE RESULTS';$('resultRows').innerHTML=a.map((d,i)=>`<div><b>${i+1}</b><span><i class="dot" style="display:inline-block;background:${d.p.color}"></i> ${d.p.name}</span><b>${fmt(d.done)}</b></div>`).join('');if(this.mode==='tour'&&this.stage<3){$('next').textContent='Next rally stage loading automatically…';$('results').classList.remove('hide');setTimeout(()=>{this.stage++;this.track=(this.track+1)%tracks.length;this.grid()},3500)}else{$('next').textContent=this.mode==='tour'?'Tournament complete. Championship points saved.':'New viewers are queued for the next race.';$('results').classList.remove('hide')}}menu(){clearInterval(this.testTimer);this.state='menu';$('menu').classList.remove('hide');$('hud').classList.add('hide');$('results').classList.add('hide')}log(t,i='•'){this.feed.unshift({t,i});this.feed=this.feed.slice(0,7);$('feed').innerHTML=this.feed.map(x=>`<div class="row" style="grid-template-columns:20px 1fr"><b>${x.i}</b><span>${x.t}</span></div>`).join('')}banner(t){$('banner').textContent=t;$('banner').classList.remove('hide');clearTimeout(this.bt);this.bt=setTimeout(()=>$('banner').classList.add('hide'),2200)}spark(d,c,n){if(!d)return;let p=d.pos(this);for(let i=0;i<n;i++)this.fx.push({x:p.x,y:p.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:1,c})}tick(dt){this.until-=dt;if(this.state==='grid'&&this.until<=0)this.countdown();else if(this.state==='count'){$('count').textContent=this.until<.6?'GO!':Math.max(1,Math.ceil(this.until));if(this.until<=0)this.race()}else if(this.state==='race'){this.t+=dt;this.ds.forEach(d=>d.tick(dt,this));this.ds.sort((a,b)=>b.u-a.u);this.ds.forEach((d,i)=>d.rank=i+1);if(this.ds[0]&&(!this.focus||!this.focus.d||Math.random()<dt*.1))this.focus=this.ds[0].p;if(this.ds.every(d=>d.done))this.finish()}this.fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt*1.4});this.fx=this.fx.filter(p=>p.l>0);this.hud()}hud(){if(this.state==='menu')return;let f=this.focus?.d||this.ds[0],lap=f?Math.max(1,Math.min(this.laps,Math.floor(Math.max(0,f.u))+1)):1;$('raceName').textContent=(this.mode==='tour'?'TOURNAMENT '+(this.stage+1)+'/4 · ':'')+tracks[this.track][0];$('lap').textContent=lap+'/'+this.laps;$('pos').textContent=(f?.rank||1)+'/'+Math.max(1,this.ds.length);$('time').textContent=fmt(this.t);$('focus').textContent=this.focus?.name||'GRID OPEN';$('nitro').style.width=(f?.nitro||0)+'%';$('leaders').innerHTML=this.ds.slice(0,12).map((d,i)=>`<div class="row"><b>${i+1}</b><i class="dot" style="background:${d.p.color}"></i><span>${d.p.name}</span><b>${d.done?fmt(d.done):(Math.max(0,d.u)).toFixed(2)+'L'}</b></div>`).join('')}draw(){let [nm,bg,w]=tracks[this.track];X.fillStyle=bg;X.fillRect(0,0,W,H);if(w===4){X.fillStyle='#15346a33';for(let i=0;i<35;i++)X.fillRect((i*97)%W,(i*53)%H,2,2)}X.lineJoin='round';X.lineCap='round';X.beginPath();for(let i=0;i<=220;i++){let p=tp(i/220,this.track);i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y)}X.closePath();X.strokeStyle='#0008';X.lineWidth=66;X.stroke();X.strokeStyle=w===2?'#59656b':'#343a40';X.lineWidth=52;X.stroke();X.setLineDash([13,14]);X.strokeStyle='#ffffff3d';X.lineWidth=2;X.stroke();X.setLineDash([]);this.ds.slice().reverse().forEach(d=>this.car(d));X.globalCompositeOperation='lighter';this.fx.forEach(p=>{X.globalAlpha=p.l;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,4+8*(1-p.l),0,TAU);X.fill()});X.globalCompositeOperation='source-over';X.globalAlpha=1;if(w===3){X.strokeStyle='#b7dcff33';for(let i=0;i<45;i++){let x=(i*71+performance.now()*.25)%W,y=(i*127+performance.now()*.45)%H;X.beginPath();X.moveTo(x,y);X.lineTo(x-7,y+18);X.stroke()}}if(w===2){X.fillStyle='#fff9';for(let i=0;i<50;i++){let x=(i*89+performance.now()*.02)%W,y=(i*59+performance.now()*.035)%H;X.fillRect(x,y,2,2)}}}car(d){let p=d.pos(this),c=d.p.color,m=d.p.model,s=prefab(m,c);X.save();X.translate(p.x,p.y);X.rotate(p.a+Math.PI/2);X.shadowBlur=d.boost>0?14:4;X.shadowColor=d.boost>0?'#29d9ff':'#000';if(s){let z=m===3?.92:m===5?1.04:1,w=42*z,h=44*z;X.drawImage(s,-w/2,-h/2,w,h);if(d.boost>0){X.globalCompositeOperation='lighter';X.fillStyle='#29d9ff38';X.beginPath();X.ellipse(0,2,19*z,25*z,0,0,TAU);X.fill();X.globalCompositeOperation='source-over'}}else{X.fillStyle='#090b0e';X.fillRect(-15,-19,5,12);X.fillRect(10,-19,5,12);X.fillRect(-15,9,5,12);X.fillRect(10,9,5,12);X.fillStyle=c;let ww=m===3?17:m===5?18:15;X.beginPath();X.moveTo(-9,-27);X.quadraticCurveTo(-ww,-18,-ww,8);X.quadraticCurveTo(-13,26,-7,28);X.lineTo(7,28);X.quadraticCurveTo(13,26,ww,8);X.quadraticCurveTo(ww,-18,9,-27);X.closePath();X.fill();X.fillStyle='#14202a';X.fillRect(-9,-14,18,11);X.fillRect(-8,8,16,8)}X.restore()}loop(t){let dt=Math.min(.04,(t-this.last)/1000);this.last=t;this.tick(dt);this.draw();requestAnimationFrame(x=>this.loop(x))}}function fmt(t){let m=Math.floor((t||0)/60),s=(t||0)%60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')}new G})();

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#10293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="God World" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v65-overrides.css" />
  <title>TikTok God World — V6.6.2 Startup Recovery</title>
</head>
<body>
  <div id="game"></div>
  <div id="loading"><div class="crest">♜</div><strong>TikTok God World</strong><span>Generating the world…</span></div>

  <header class="hud topbar">
    <div class="brand"><span class="live">LIVE</span><b>TikTok God World</b><span class="build-tag">V6.6.2 STABLE</span></div>
    <div class="stats"><span id="age">0:00</span><small>world age</small><span id="fps">60 FPS</span><span id="players">0 kingdoms</span></div>
    <div class="bridge command-rotator"><i id="bridgeDot"></i><span id="commandIcon">&#128081;</span><span id="bridgeText">JOIN = create your kingdom</span></div>
  </header>

  <aside id="ranking" class="hud panel ranking"><b>WORLD POWERS</b><div id="rankRows"></div></aside>

  <section id="kingdomCard" class="hud panel kingdom-card hidden">
    <div class="k-eyebrow">KINGDOM IN FOCUS</div>
    <div class="k-head"><i id="kColor"></i><b id="kName">—</b><button id="closeCard" aria-label="Close details">×</button></div>
    <div class="resources">
      <span><em>🌾</em><small>Food</small><b id="rFood">0</b></span><span><em>🪵</em><small>Wood</small><b id="rWood">0</b></span><span><em>🪨</em><small>Stone</small><b id="rStone">0</b></span><span><em>🪙</em><small>Gold</small><b id="rGold">0</b></span>
    </div>
    <div class="k-grid"><span><small>POPULATION</small><b id="rPop">0</b></span><span><small>TERRITORY</small><b id="rTerr">0</b></span><span><small>POWER</small><b id="rPower">0</b></span><span><small>BUILDINGS</small><b id="rBuild">0</b></span></div>
    <div class="k-zoom-note">Appears automatically when entering a kingdom</div>
  </section>

  <div id="toast"></div>
  <audio id="bgMusic" src="assets/audio/medieval-market-full.mp3" preload="auto" autoplay loop playsinline></audio>
  <canvas id="weatherCanvas" aria-hidden="true"></canvas>
  <div id="worldEvent" class="world-event hud" aria-live="polite"></div>

  <section id="testPanel" class="hud test-panel collapsed">
    <button id="toggleTest">TEST</button>
    <div class="test-inner">
      <input id="testName" value="Player" maxlength="18" />
      <button data-test="join">JOIN</button><button data-test="like">LIKE ×20</button><button data-test="follow">FOLLOW</button><button data-test="rose">ROSE</button><button data-test="ice">ICE CREAM</button><button data-test="fireworks">FIREWORKS</button><button data-test="swan">SWAN</button><button data-test="concert">CONCERT</button><button data-test="money">MONEY GUN</button><button data-test="jet">PRIVATE JET</button><button data-test="meteor">METEOR</button><button data-test="car">SPORTS CAR</button><button data-test="galaxy">GALAXY</button><button data-test="lion">LION</button><button data-test="dragon">DRAGON</button><button data-test="universe">UNIVERSE</button><button data-test="attack">ATTACK</button><button data-test="boost">+30s</button>
    </div>
  </section>

  <div id="feed" hidden></div>

  <div class="zoom hud"><button id="zoomIn">＋</button><button id="zoomOut">－</button><button id="homeCam">⌂</button></div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"></script>
  <script src="asset-recovery.js"></script>
  <script src="game.js"></script>
  <script src="tree-depth.js"></script>
  <script src="lan-bridge.js"></script>
  <script src="interface-v63.js"></script>
  <script src="world-effects.js"></script>
  <script src="music.js"></script>
  <script src="living-kingdoms-v65.js"></script>
  <script src="v651-ground-contact.js"></script>
  <script src="v66-living-battles.js"></script>
  <script src="v661-battle-stability.js"></script>
  <script src="construction-phases-v662-native-pixel.js?v=20260812-1926"></script>
  <script src="v67-w1.js?v=20260812-1926"></script>
  <script src="v67-w2.js?v=20260812-1926"></script>
  <script src="v67-w3.js?v=20260812-1926"></script>
  <script src="v67-w4.js?v=20260812-1926"></script>
  <script src="v67-w5.js?v=20260812-1926"></script>
  <script src="v67-w6.js?v=20260812-1926"></script>
  <script src="v67-w7.js?v=20260812-1926"></script>
  <script src="v67-assets-church.js?v=20260812-1926"></script>
  <script src="v67-assets-port.js?v=20260812-1926"></script>
  <script src="v67-pixel-buildings.js?v=20260812-1926"></script>
  <script src="v68-fishing-asset.js?v=20260812-1926"></script>
  <script src="v68-fishing-boats.js?v=20260812-1926"></script>
</body>
</html>

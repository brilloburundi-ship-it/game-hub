[package]
name = "fighter-arena-desktop"
version = "1.0.0"
description = "Lightweight Windows desktop build of TikTok Fighter Arena"
authors = ["Game Hub"]
edition = "2021"

[lib]
name = "fighter_arena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

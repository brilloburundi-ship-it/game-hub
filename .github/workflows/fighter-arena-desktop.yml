name: Fighter Arena Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/tiktok-fighter-arena/**'
      - '.github/workflows/fighter-arena-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'games/tiktok-fighter-arena/**'
      - '.github/workflows/fighter-arena-desktop.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop tooling
        working-directory: games/tiktok-fighter-arena/desktop
        run: npm install

      - name: Build Fighter Arena installer
        working-directory: games/tiktok-fighter-arena/desktop
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fighter-Arena-Windows
          path: games/tiktok-fighter-arena/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

name: Sync SatNOGS receiver cache

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'scripts/sync_satnogs_receiver.py'
      - '.github/workflows/satnogs-receiver-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Sync SatNOGS data
        run: python scripts/sync_satnogs_receiver.py

      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/satellite-signal-receiver/data/remote.json
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "Refresh SatNOGS receiver cache"
            git push
          fi

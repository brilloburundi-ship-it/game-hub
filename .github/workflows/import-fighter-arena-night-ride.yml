name: Import Fighter Arena Night Ride

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-fighter-arena-night-ride.yml

permissions:
  contents: write

jobs:
  import-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Night Ride through current Piped instances
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_ID='6BaG-oMy8OM'
          TARGET='games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3'
          mkdir -p "$(dirname "$TARGET")"
          rm -f /tmp/night-ride-source "$TARGET"

          APIS=(
            'https://pipedapi.kavin.rocks'
            'https://pipedapi.leptons.xyz'
            'https://pipedapi.nosebs.ru'
            'https://pipedapi-libre.kavin.rocks'
            'https://piped-api.privacy.com.de'
            'https://pipedapi.adminforge.de'
            'https://api.piped.yt'
            'https://pipedapi.drgns.space'
            'https://pipedapi.owo.si'
            'https://pipedapi.ducks.party'
            'https://piped-api.codespace.cz'
            'https://pipedapi.reallyaweso.me'
            'https://api.piped.private.coffee'
            'https://pipedapi.darkness.services'
            'https://pipedapi.orangenet.cc'
          )

          DOWNLOADED=''
          for API in "${APIS[@]}"; do
            echo "Trying $API"
            JSON=$(mktemp)
            if ! curl -fsSL --retry 1 --connect-timeout 8 --max-time 30 "$API/streams/$VIDEO_ID" -o "$JSON"; then
              rm -f "$JSON"
              continue
            fi
            TITLE=$(jq -r '.title // empty' "$JSON")
            echo "Resolved title: $TITLE"
            URL=$(jq -r '[.audioStreams[]? | select(.url != null and .url != "")] | sort_by(.bitrate // 0) | reverse | .[0].url // empty' "$JSON")
            rm -f "$JSON"
            [ -n "$URL" ] || continue
            if curl -fL --retry 2 --connect-timeout 12 --max-time 900 "$URL" -o /tmp/night-ride-source; then
              if [ -s /tmp/night-ride-source ]; then
                DOWNLOADED='yes'
                break
              fi
            fi
          done

          test -n "$DOWNLOADED"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/night-ride-source -vn -c:a libmp3lame -b:a 128k -ar 44100 -ac 2 "$TARGET"
          test -s "$TARGET"
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$TARGET")
          SIZE=$(stat -c%s "$TARGET")
          echo "duration=$DURATION size=$SIZE"
          awk -v d="$DURATION" 'BEGIN { exit !(d > 4200 && d < 4300) }'
          test "$SIZE" -lt 100000000

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Game Hub
        run: |
          npm install --ignore-scripts
          npm run check:pages

      - name: Commit imported BGM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'Add Fighter Arena Night Ride BGM'
          git push origin HEAD:main

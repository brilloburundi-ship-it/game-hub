name: Import Fighter Arena Night Ride

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-fighter-arena-night-ride.yml

permissions:
  contents: write

jobs:
  import-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandcamp downloader
        run: python -m pip install --disable-pip-version-check -q yt-dlp

      - name: Build Night Ride from official White Bat Audio tracks
        shell: bash
        run: |
          set -euo pipefail
          TARGET='games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3'
          WORK='/tmp/night-ride'
          rm -rf "$WORK"
          mkdir -p "$WORK" "$(dirname "$TARGET")"

          SLUGS=(
            night-crawler
            the-chase
            lost-vegas
            the-drop
            alien-ruins
            replicant-hunter
            vortex-queen
            alliance
            the-beautiful-ones
            rain-city
            edge-of-tomorrow
            menace
            chrome-skull
            dark-city
            puncture
            the-quarantine-squad
            death-draws-near
          )

          : > "$WORK/concat.txt"
          index=0
          for slug in "${SLUGS[@]}"; do
            index=$((index+1))
            n=$(printf '%02d' "$index")
            echo "Downloading $n/17: $slug"
            yt-dlp --no-playlist -f bestaudio \
              -o "$WORK/${n}.source.%(ext)s" \
              "https://karlcasey.bandcamp.com/track/$slug"
            source=$(find "$WORK" -maxdepth 1 -type f -name "${n}.source.*" | head -n1)
            test -n "$source" -a -s "$source"
            ffmpeg -hide_banner -loglevel error -y -i "$source" -vn \
              -ar 44100 -ac 2 -c:a pcm_s16le "$WORK/${n}.wav"
            printf "file '%s'\n" "$WORK/${n}.wav" >> "$WORK/concat.txt"
          done

          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i "$WORK/concat.txt" \
            -t 4237.949388 -vn -ar 44100 -ac 2 \
            -c:a libmp3lame -b:a 128k "$TARGET"

          test -s "$TARGET"
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$TARGET")
          BITRATE=$(ffprobe -v error -show_entries format=bit_rate -of default=nw=1:nk=1 "$TARGET")
          SIZE=$(stat -c%s "$TARGET")
          echo "duration=$DURATION bitrate=$BITRATE size=$SIZE"
          awk -v d="$DURATION" 'BEGIN { exit !(d > 4236 && d < 4240) }'
          awk -v b="$BITRATE" 'BEGIN { exit !(b > 120000 && b < 136000) }'
          test "$SIZE" -lt 100000000

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Game Hub
        run: |
          npm install --ignore-scripts
          npm run check:pages

      - name: Commit imported BGM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'Add Fighter Arena Night Ride BGM'
          git push origin HEAD:main

name: Import Fighter Arena Night Ride

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-fighter-arena-night-ride.yml

permissions:
  contents: write

jobs:
  import-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio importer
        run: python -m pip install --disable-pip-version-check -q yt-dlp

      - name: Download Night Ride at game-friendly bitrate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/tiktok-fighter-arena/assets/audio/music
          yt-dlp --no-playlist --extract-audio --audio-format mp3 --audio-quality 128K \
            --output 'games/tiktok-fighter-arena/assets/audio/music/night-ride.%(ext)s' \
            'https://www.youtube.com/watch?v=6BaG-oMy8OM'
          test -s games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3
          SIZE=$(stat -c%s games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3)
          test "$SIZE" -lt 100000000
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 \
            games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Game Hub
        run: |
          npm install --ignore-scripts
          npm run check:pages

      - name: Commit imported BGM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/tiktok-fighter-arena/assets/audio/music/night-ride.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'Add Fighter Arena Night Ride BGM'
          git push origin HEAD:main

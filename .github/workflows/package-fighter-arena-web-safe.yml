name: Package Fighter Arena WEB SAFE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'games/tiktok-fighter-arena/**'
      - '.github/workflows/package-fighter-arena-web-safe.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ONE START WEB SAFE package
        shell: bash
        run: |
          set -euo pipefail
          SRC="games/tiktok-fighter-arena"
          OUT="dist/Fighter-Arena-WEB-DESKTOP-SAFE-ONE-START"
          SYS="$OUT/_system"
          mkdir -p "$SYS"

          # Unico file che l'utente deve premere.
          cp "$SRC/AVVIA_FIGHTER_ARENA_WEB_SAFE.cmd" "$OUT/AVVIA_FIGHTER_ARENA_WEB_SAFE.cmd"

          # Tutto il runtime resta in una sola cartella di supporto.
          rsync -a "$SRC/" "$SYS/" \
            --exclude '.git' \
            --exclude 'bridge/' \
            --exclude 'AVVIA_FIGHTER_ARENA_WEB_SAFE.cmd' \
            --exclude 'AVVIA_FIGHTER_ARENA_LIVE.bat' \
            --exclude 'AVVIA_IPHONE_TIKFINITY.bat' \
            --exclude 'ABILITA_BRIDGE_WIFI.bat' \
            --exclude 'INSTALLA_FIGHTER_ARENA_WEB_SAFE.cmd' \
            --exclude 'START_FIGHTER_ARENA_WEB_SAFE.cmd' \
            --exclude 'install-web-safe.ps1' \
            --exclude 'KILL_ALL_GAME_BRIDGES_GLOBAL.cmd' \
            --exclude 'BRIDGE_CLOUD.md' \
            --exclude 'BRIDGE_TIKFINITY.md' \
            --exclude 'URL_IPHONE.txt' \
            --exclude 'URL_FIGHTER_ARENA_LIVE.txt' \
            --exclude '_probe*.txt' \
            --exclude '_tmp_marker.txt'

          test -f "$OUT/AVVIA_FIGHTER_ARENA_WEB_SAFE.cmd"
          test -f "$SYS/one-start-web-safe.ps1"
          test -f "$SYS/desktop-live.html"
          test -f "$SYS/desktop-tikfinity-safe.js"
          test -f "$SYS/web-safe-server.mjs"

          cd dist
          zip -r -9 Fighter-Arena-WEB-DESKTOP-SAFE-ONE-START.zip Fighter-Arena-WEB-DESKTOP-SAFE-ONE-START

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Fighter-Arena-WEB-DESKTOP-SAFE-ONE-START
          path: dist/Fighter-Arena-WEB-DESKTOP-SAFE-ONE-START.zip
          if-no-files-found: error
          retention-days: 14

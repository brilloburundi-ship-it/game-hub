name: Package Fighter Arena

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-fighter-arena.yml'
      - 'games/tiktok-fighter-arena/**'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          cd games
          zip -r ../Fighter-Arena-TikTool-WebApp.zip tiktok-fighter-arena

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fighter-Arena-TikTool-WebApp
          path: Fighter-Arena-TikTool-WebApp.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

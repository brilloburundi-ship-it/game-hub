name: Package Fighter Arena

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-fighter-arena.yml'
      - 'games/tiktok-fighter-arena/**'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean one-start ZIP
        run: |
          set -e
          mkdir -p package/Fighter-Arena-TikTool
          rsync -a \
            --exclude='*.cmd' \
            --exclude='*.bat' \
            --exclude='bridge/' \
            --exclude='BRIDGE_TIKFINITY.md' \
            --exclude='desktop-tikfinity-safe.js' \
            --exclude='lan-bridge.js' \
            --exclude='install-web-safe.ps1' \
            games/tiktok-fighter-arena/ package/Fighter-Arena-TikTool/
          cp 'games/tiktok-fighter-arena/AVVIA FIGHTER ARENA.cmd' 'package/Fighter-Arena-TikTool/AVVIA FIGHTER ARENA.cmd'
          cd package
          zip -r ../Fighter-Arena-TikTool-ONE-START.zip Fighter-Arena-TikTool

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fighter-Arena-TikTool-ONE-START
          path: Fighter-Arena-TikTool-ONE-START.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
